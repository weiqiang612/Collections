server:
  port: 8080

spring:
  profiles:
    active: dev
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/portfolio?useSSL=false&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
  ai:
    openai:
      base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api}
      api-key: ${OPENROUTER_API_KEY:}
      chat:
        options:
          model: ${OPENROUTER_MODEL:tencent/hy3-preview:free}
          temperature: ${OPENROUTER_TEMPERATURE:0.7}

mybatis:
  mapper-locations: classpath*:mappers/**/*.xml
  type-aliases-package: com.weiqiang.portfolio.domain
  configuration:
    map-underscore-to-camel-case: true
